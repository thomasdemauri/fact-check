<div class="flex flex-col h-[90vh] min-h-0 gap-4 p-4">

  <div class="w-full rounded-lg bg-white px-4 pt-4 pb-2 shadow-md">
    <form class="mx-auto flex w-full max-w-3xl justify-center">
      <app-deputy-filter (deputySelected)="deputySelected($event)"></app-deputy-filter>
    </form>
  </div>

  @if (response.isLoading()) {
    <div class="h-[80vh] flex justify-center">
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    </div>
    }

  @if (response.value()) {
    <div class="min-h-0 flex-1 flex flex-col gap-4 overflow-y-auto">
      @for (proposition of propositions(); track proposition.id) {
        <app-card [proposition]="proposition" />
      }
    </div>
  }

  <nav class="mt-auto flex shrink-0 flex-wrap justify-center gap-2 border-t border-gray-200 bg-gray-50 py-3" aria-label="Paginação">
    <button type="button" class="cursor-pointer rounded-md px-3 py-2 text-sm text-blue-700 hover:bg-blue-50" (click)="goTo(firstPage())">Primeira</button>
    @if (previousPage() != null) {
    <button type="button" class="cursor-pointer rounded-md px-3 py-2 text-sm text-blue-700 hover:bg-blue-50" (click)="goTo(previousPage())">Anterior</button>
    }
    @if (nextPage() != null) {
    <button type="button" class="cursor-pointer rounded-md px-3 py-2 text-sm text-blue-700 hover:bg-blue-50" (click)="goTo(nextPage())">Próxima</button>
    }
    <button type="button" class="cursor-pointer rounded-md px-3 py-2 text-sm text-blue-700 hover:bg-blue-50" (click)="goTo(lastPage())">Última</button>
  </nav>
</div>
