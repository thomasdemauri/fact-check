<div class="flex h-[80vh] min-h-0 flex-col gap-4 p-4">
  <div class="min-h-0 flex-1 space-y-4 overflow-y-auto">
    @for (proposition of propositions(); track proposition.id) {
      <app-card [proposition]="proposition" />
    }
  </div>

  <nav class="flex shrink-0 flex-wrap justify-center gap-2 border-t border-gray-200 bg-gray-50 py-3" aria-label="Paginação">
    <button type="button" class="rounded-md px-3 py-2 text-sm text-blue-700 hover:bg-blue-50" (click)="goTo(firstPage())">Primeira</button>
    @if (previousPage() != null) {
    <button type="button" class="rounded-md px-3 py-2 text-sm text-blue-700 hover:bg-blue-50" (click)="goTo(previousPage())">Anterior</button>
    }
    @if (nextPage() != null) {
    <button type="button" class="rounded-md px-3 py-2 text-sm text-blue-700 hover:bg-blue-50" (click)="goTo(nextPage())">Próxima</button>
    }
    <button type="button" class="rounded-md px-3 py-2 text-sm text-blue-700 hover:bg-blue-50" (click)="goTo(lastPage())">Última</button>
  </nav>

</div>
