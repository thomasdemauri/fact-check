<main>
  <div class="bg-gray-50 flex justify-center items-center h-12">
    <h2 class="text-green-700 font-bold text-xl">
      checkfatos.com
    </h2>
  </div>

  <div ngToolbar aria-label="Text Formatting Tools">
    <div class="h-12 px-4 flex justify-start gap-3 shadow-md bg-gray-50">
      <button
        ngToolbarWidget
        value="proposicoes"
        type="button"
        (click)="goToPropositions()"
        aria-label="Proposições"
        class="text-blue-700 hover:text-blue-900 cursor-pointer"
      >
        Proposições
      </button>

      <button
        ngToolbarWidget
        value="deputados"
        type="button"
        (click)="showDeputySearch.set(true)"
        aria-label="Deputados"
        class="text-blue-700 hover:text-blue-900 cursor-pointer"
      >
        Deputados
      </button>
    </div>
  </div>

  @if (showDeputySearch()) {
    <div class="flex gap-3 p-4">
      <input
        #deputyId
        type="number"
        placeholder="ID do deputado"
        class="rounded-md border border-gray-300 px-3 py-2 text-sm"
        (keyup.enter)="searchDeputy(deputyId.value)"
      />
      <button
        type="button"
        class="rounded-md px-4 py-2 text-sm font-medium text-blue-600 hover:bg-blue-50 cursor-pointer"
        (click)="searchDeputy(deputyId.value)"
      >
        Buscar
      </button>
    </div>
  }
	<section>
		<router-outlet />
	</section>
</main>
